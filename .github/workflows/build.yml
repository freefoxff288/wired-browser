# Сборка Wired Browser для Windows: .exe + Qt + Chromium (QtWebEngine) в одном zip.
# Тег v* → zip прикрепляется к GitHub Release.
name: windows
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build --config Release
      - name: Deploy
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/WiredBrowser | Out-Null
          Copy-Item build/Release/WiredBrowser.exe dist/WiredBrowser/
          windeployqt --release --qmldir src --no-translations dist/WiredBrowser/WiredBrowser.exe
          # рантайм MSVC рядом с .exe — чтобы не просить друга ставить vc_redist
          foreach ($d in 'msvcp140.dll','msvcp140_1.dll','vcruntime140.dll','vcruntime140_1.dll') { Copy-Item "$env:WINDIR/System32/$d" dist/WiredBrowser/ }
      - name: Smoke test (запуск, загрузка QML, выход через 8 с)
        shell: pwsh
        run: |
          $p = Start-Process dist/WiredBrowser/WiredBrowser.exe -ArgumentList '--smoke' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "не закрылся за 90 с" }
          if ($p.ExitCode -ne 0) { throw "код выхода $($p.ExitCode)" }
      - name: Zip
        shell: pwsh
        run: Compress-Archive dist/WiredBrowser WiredBrowser-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WiredBrowser-windows-x64
          path: WiredBrowser-windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WiredBrowser-windows-x64.zip
